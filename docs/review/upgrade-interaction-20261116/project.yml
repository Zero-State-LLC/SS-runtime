name: SSUpgradeReview
options:
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
packages:
  SurveillanceCore:
    path: ../../..
targets:
  SSUpgradeReview:
    type: application
    platform: iOS
    sources:
      - path: Host
      - path: ../../../App/UpgradeSelectionView.swift
    dependencies:
      - package: SurveillanceCore
        product: SurveillanceCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zer0state.review.upgrade20261116
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    scheme:
      testTargets:
        - SSUpgradeReviewUITests
  SSUpgradeReviewUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: SSUpgradeReview
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zer0state.review.upgrade20261116.tests
        TEST_TARGET_NAME: SSUpgradeReview
