name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  swift:
    runs-on: macos-15
    # Build with the Swift 6.2+ generation developers use. The runner default
    # (Xcode 16.4, Swift 6.1) needs over 5x the debug stack for a simulation
    # tick and overflowed Swift Testing's 512 KB worker threads (SIGBUS) on
    # SS-runtime #104; the same code needs ~96 KB under Swift 6.3.
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned specification
        run: grep -q "b1ed874e1e8eb0e61b2174b9093201e9a61e1a4b" SPEC_BASELINE.md
      - name: Test deterministic core
        run: swift test --skip CameraPlacementTests --skip CameraFairnessTests --parallel --num-workers 1
      - name: Test camera placement
        run: swift test --filter CameraPlacementTests --parallel --num-workers 1
      - name: Test camera fairness
        run: swift test --filter CameraFairnessTests --parallel --num-workers 1

  spec-parity:
    # D-061: from the adoption commit the runtime bundle must byte-match
    # SS-specs contracts/ and fixtures/. This job checks out the spec at the
    # pinned commit and byte-compares every bundled file, plus enforces that
    # all identity sources agree on the pin. The one documented exception is
    # the asset catalog's specificationCommit field (D-065), which the script
    # asserts is the ONLY difference. A guard nobody has seen fail is not yet
    # a guard: the negative proof (one-byte edit -> failure) is in the PR that
    # introduced this job.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned specification
        run: grep -q "b1ed874e1e8eb0e61b2174b9093201e9a61e1a4b" SPEC_BASELINE.md
      - name: Test runtime audit wiring guards
        run: python3 -B scripts/test_runtime_audit_guards.py
      - name: Set up source-review Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source-review dependencies
        run: python3 -m pip install numpy==2.4.6 Pillow==12.3.0 scipy==1.17.1
      - name: Test portable source geometry and provenance
        run: python3 -B docs/review/player-all-release-source-20261116/test_source.py --source-root docs/review/player-all-release-source-20261116/fixtures
      - name: Test source artifact and browser-readiness guards
        run: |
          python3 -B docs/review/player-all-release-source-20261116/test_artifact_verifier.py
          node docs/review/player-all-release-source-20261116/test_readiness.js
      - name: Verify source artifacts and native resource linkage
        run: python3 -B docs/review/player-all-release-source-20261116/verify_artifacts.py --native-assets AppTests/BenchmarkAssets
      - name: Test native source evidence import guards
        run: python3 -B scripts/test_allrelease_native.py
      - name: Verify published native source evidence
        run: python3 -B scripts/import_allrelease_native.py --verify docs/review/player-all-release-native-20261116
      - name: Test proposed phase variation and comparison controls
        run: |
          python3 -B docs/review/player-release-variation-20261116/test_variation.py
          python3 -B docs/review/player-release-variation-20261116/test_artifacts.py
          node docs/review/player-release-variation-20261116/test_comparison.js
      - name: Verify proposed variation source provenance
        run: python3 -B docs/review/player-release-variation-20261116/verify_packet.py
      - name: Verify paired native variation evidence
        run: |
          python3 -B scripts/prepare_release_variation_native.py --verify
          python3 -B scripts/import_release_variation_native.py --verify docs/review/player-release-variation-native-20261116/capture
          python3 -B scripts/test_release_variation_native.py
      - name: Verify proposed neutral source comparisons
        run: |
          python3 -B docs/review/player-north-source-20261116/test_source.py
          python3 -B docs/review/player-baggy-south-source-20261116/test_source.py
          python3 -B -W error::ResourceWarning docs/review/camera-midpoint-source-20261116/test_source.py
          cmp docs/review/camera-midpoint-source-20261116/source/clip-metadata-001.json Sources/SurveillanceCore/Resources/contracts/clip-metadata-001.json
      - name: Test portable side-source proposals
        run: python3 -B -W error::ResourceWarning docs/review/player-side-source-20261116/test_source.py
      - name: Test portable ground-contact evidence
        run: |
          python3 -B -W error::ResourceWarning docs/review/player-ground-contact-20261116/test_packet.py
          python3 -B -W error::ResourceWarning docs/review/player-ground-contact-20261116/test_native_evidence.py
          node docs/review/player-ground-contact-20261116/test_native_gallery.js
      - name: Test unregistered stone-building source provenance
        run: python3 -B -W error::ResourceWarning docs/review/stone-corner-source-20261116/test_source.py
      - name: Test whole-scene diagnostic evidence without visual admission
        run: |
          python3 -B -W error::ResourceWarning -m unittest discover -s docs/review/whole-scene-benchmark-20261116 -p 'test_*.py'
          python3 -B -W error::ResourceWarning -m unittest discover -s docs/review/whole-scene-paving-20261116 -p 'test_*.py'
          python3 -B -W error::ResourceWarning -m unittest discover -s docs/review/whole-scene-benchmark-20261116/revision-02-bound-inputs -p 'test_*.py'
          python3 -B -W error::ResourceWarning -m unittest discover -s docs/review/camera-first-sample-20261116 -p 'test_*.py'
      - name: Test blocked-source records and bounded paving repair
        run: |
          python3 -B -W error::ResourceWarning docs/review/stone-corner-registration-20261116/test_registration.py
          python3 -B -W error::ResourceWarning docs/review/player-neutral-family-20261116/test_family.py
          python3 -B -W error::ResourceWarning docs/review/paving-repeat-repair-20261116/verify-packet.py
          python3 -B -W error::ResourceWarning docs/review/paving-repeat-repair-20261116/revision02/generate-and-check.py
      - name: Test existing-art diagnostic evidence without granting acceptance
        run: |
          python3 -B -W error::ResourceWarning -m unittest discover -s docs/review/existing-art-traversal-20261116 -p 'test_*.py' -v
          python3 -B -W error::ResourceWarning docs/review/existing-art-viewports-20261116/test_verify.py
          python3 -B -W error::ResourceWarning -m unittest discover -s docs/review/existing-art-encounters-20261116 -p 'test_*.py' -v
      - name: Test bounded source proposals and actual upgrade evidence without admission
        run: |
          python3 -B -W error::ResourceWarning docs/review/player-south-repair-20261116/test_south.py
          python3 -B -W error::ResourceWarning docs/review/paving-corner-review-20261116/test_source.py
          python3 -B -W error::ResourceWarning docs/review/stone-surface-authored-20261116/test_source.py
          python3 -B -W error::ResourceWarning docs/review/camera-surface-authored-20261116/test_final.py
          python3 -B -W error::ResourceWarning docs/review/camera-raster-material-20261116/painted-assembly/padded-final/test_padding.py
          python3 -B -W error::ResourceWarning docs/review/stone-painted-facade-20261116/test_source.py
          python3 -B -W error::ResourceWarning docs/review/stone-painted-facade-20261116/test_roof_layer.py
          python3 -B -W error::ResourceWarning docs/review/stone-painted-facade-20261116/verify_exports.py
          python3 -B -W error::ResourceWarning -m unittest discover -s docs/review/scene-source-assembly-20261116 -p 'test_*.py'
          python3 -B -W error::ResourceWarning docs/review/upgrade-interaction-20261116/test_evidence.py
      - name: Test retained playback failure diagnosis without hiding the failure
        run: python3 -B -W error::ResourceWarning -m unittest discover -s docs/review/playback237-diagnosis-20261116 -p 'test_trace_probe.py' -v
      - name: Byte-compare bundled contracts and fixtures against the pinned SS-specs
        run: bash scripts/spec_parity.sh

  app:
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    # The iOS app target had never been compiled by CI: Bundle.module was
    # unavailable to a framework target and App/ had access-level errors.
    # Build it on every change so the README bootstrap path stays honest.
    #
    # It now runs SSRuntimeTests too. App/ is built by XcodeGen and is never
    # compiled by `swift test`, so touch routing, input, and HUD interaction had
    # no automated coverage — the shared root cause of the upgrade-gate restart
    # (#65) and the never-called TouchController.reset() (#66).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build and test SSRuntime for iOS Simulator
        run: |
          set -euo pipefail
          sim="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); ds=[x for v in d["devices"].values() for x in v if "iPhone" in x["name"]]; print(ds[-1]["udid"])')"
          # `| grep ... || true` cannot guard this build: under `pipefail` a
          # failed xcodebuild makes the pipeline non-zero, `|| true` fires, and
          # running `true` resets PIPESTATUS to [0] — so the guard below always
          # read 0 and the job could never fail. Keep xcodebuild's own status.
          set +e
          xcodebuild -project SSRuntime.xcodeproj -scheme SSRuntime -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$sim" -configuration "${{ matrix.configuration }}" \
            CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES \
            SS_RENDERER_TEST_CONDITIONS=SS_RENDERER_TEST_SUPPORT \
            -resultBundlePath /tmp/SSRuntime.xcresult test \
            > /tmp/xcodebuild.log 2>&1
          status=$?
          set -e
          grep -E "error:|warning:|✘|Test run with|BUILD (SUCCEEDED|FAILED)|TEST (SUCCEEDED|FAILED)" /tmp/xcodebuild.log || true
          if [ "$status" -ne 0 ]; then
            tail -n 250 /tmp/xcodebuild.log
            xcrun xcresulttool get test-results summary --path /tmp/SSRuntime.xcresult || true
          fi
          exit "$status"
      - name: Preserve app test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-tests-${{ matrix.configuration }}
          path: |
            /tmp/xcodebuild.log
            /tmp/SSRuntime.xcresult
          retention-days: 7

  device-sitting:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Probe the device-sitting runs
        run: bash scripts/device_sitting_qa.sh
